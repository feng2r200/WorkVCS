[workspace]
members = [
    "crates/workvcs-core",
    "crates/workvcs-cli",
]
resolver = "3"

[workspace.package]
version = "1.2.0"
edition = "2024"
authors = ["feng2r200"]
description = "Local-first version control for Agent work and knowledge state"
homepage = "https://github.com/feng2r200/WorkVCS"
license = "Apache-2.0"
repository = "https://github.com/feng2r200/WorkVCS"
rust-version = "1.98.1"

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
jieba-rs = "=0.10.4"
glob = "0.3"
proptest = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
rustix = { version = "=1.1.4", features = ["fs"] }
tempfile = "3.27.0"
thiserror = "2.0"
tiktoken-rs = "=0.12.1"
uuid = { version = "1.18", features = ["serde", "v7"] }
