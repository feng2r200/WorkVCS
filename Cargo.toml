[workspace]
members = [
    "crates/workvcs-core",
    "crates/workvcs-cli",
]
resolver = "3"

[workspace.package]
version = "1.3.2"
edition = "2024"
authors = ["feng2r200"]
description = "Local-first version control for Agent work and knowledge state"
homepage = "https://github.com/feng2r200/WorkVCS"
license = "Apache-2.0"
repository = "https://github.com/feng2r200/WorkVCS"
rust-version = "1.98.1"

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
fastembed = { version = "=7.1.1", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
fs4 = "=1.1.0"
jieba-rs = "=0.10.4"
glob = "0.3"
onnx-protobuf = "=0.2.3"
protobuf = "=3.4.0"
proptest = "1.6"
qdrant-edge = "=0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.11.0"
sysinfo = "=0.39.6"
toml = "1.1"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
rustix = { version = "=1.1.4", features = ["fs"] }
tempfile = "3.27.0"
thiserror = "2.0"
tiktoken-rs = "=0.12.1"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
uuid = { version = "1.18", features = ["serde", "v7"] }
