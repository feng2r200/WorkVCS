name: Bug report
description: Report a reproducible WorkVCS defect.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Remove credentials, private paths, proprietary content, and sensitive
        WorkVCS Store data. Report security issues through SECURITY.md.
  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: "workvcs 0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, architecture, Rust version"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the exact commands and sanitized inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched for an existing issue.
          required: true
        - label: I removed private or sensitive data.
          required: true
