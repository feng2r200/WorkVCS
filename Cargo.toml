[workspace]
members = [
    "crates/workvcs-core",
    "crates/workvcs-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.100"

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
proptest = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v7"] }
