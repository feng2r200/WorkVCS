name: Feature proposal
description: Propose a focused WorkVCS capability or design improvement.
title: "proposal: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What Agent work-state problem cannot be solved today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and boundaries
      description: What should remain unchanged or explicitly out of scope?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Examples or evidence
      description: Add sanitized workflows, alternatives, or prior art.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I reviewed the product and architecture documentation.
          required: true
        - label: I searched for an existing proposal.
          required: true
