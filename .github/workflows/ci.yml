name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate semantic version bump
        env:
          VERSION_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$VERSION_BASE_REF" ] && [ "$VERSION_BASE_REF" != "0000000000000000000000000000000000000000" ]; then
            scripts/validate-version-bump.sh --base-ref "$VERSION_BASE_REF"
          else
            scripts/validate-version-bump.sh
          fi

      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Validate schema
        run: scripts/validate-schema-v0.1.sh

      - name: Run CLI smoke workflow
        run: scripts/smoke-v0.1-cli-workflow.sh

      - name: Validate ProjectRef acceptance matrix
        run: scripts/validate-projectref-acceptance-matrix.sh
